<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#0e2320" />
      <stop offset="100%" stop-color="#071513" />
    </radialGradient>
    
    <!-- Sun / Beacon Gradient -->
    <linearGradient id="sunGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#f58529" />
      <stop offset="60%" stop-color="#e67012" />
      <stop offset="100%" stop-color="#c95707" />
    </linearGradient>

    <!-- Subtle Drop Shadow on Pin Marker -->
    <filter id="pinShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Squircle App Icon Background -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />

  <!-- Outer Map Pin (Off-White / Mint Pale) -->
  <path
    d="M 256 98
       C 174 98 108 164 108 246
       C 108 308 170 376 244 425
       C 251 430 261 430 268 425
       C 342 376 404 308 404 246
       C 404 164 338 98 256 98 Z"
    fill="#edf3f0"
    filter="url(#pinShadow)"
  />

  <!-- Mountain Peak / Sector with curved bottom -->
  <path
    d="M 256 156
       L 338 298
       C 314 316 286 324 256 324
       C 226 324 198 316 174 298
       Z"
    fill="#1d3f38"
  />

  <!-- Glowing Sun / Beacon Center -->
  <circle cx="256" cy="236" r="30" fill="url(#sunGrad)" />
</svg>
